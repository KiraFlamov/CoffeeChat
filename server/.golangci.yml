version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    paths:
      - gen

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - gen
