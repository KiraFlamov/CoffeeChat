# Команды проекта. Запуск: task <имя>. Список: task --list
# Task выбран вместо make: одинаково работает на Windows и в Linux без дополнительной оболочки.
version: '3'

tasks:
  default:
    desc: Показать список команд
    cmds:
      - task --list
    silent: true

  lint:
    desc: Линтеры Go и TypeScript, проверка форматирования
    deps: [lint:go, lint:ts, lint:proto]

  lint:go:
    desc: golangci-lint для server/ и deploy/image/
    cmds:
      # По очереди: golangci-lint не разрешает два своих запуска одновременно.
      - task: lint:server
      - task: lint:image

  lint:server:
    desc: golangci-lint для server/
    dir: server
    cmds:
      - golangci-lint run ./...

  lint:image:
    desc: golangci-lint для сборщика образа deploy/image/
    dir: deploy/image
    cmds:
      - golangci-lint run --config ../../server/.golangci.yml ./...

  lint:ts:
    desc: ESLint, Prettier и проверка типов
    cmds:
      - pnpm exec eslint .
      - pnpm exec prettier --check .
      - pnpm -r run typecheck

  lint:proto:
    desc: buf lint и проверка форматирования схем в proto/
    cmds:
      - pnpm exec buf lint
      - pnpm exec buf format --diff --exit-code

  proto:
    desc: Сгенерировать код Go и TypeScript из proto/
    cmds:
      - pnpm exec buf lint
      - pnpm exec buf generate

  test:
    desc: Все тесты (Go и TypeScript)
    deps: [test:go, test:image, test:ts]

  test:go:
    desc: Тесты Go
    dir: server
    cmds:
      - go test ./...

  test:image:
    desc: Тесты сборщика образа
    dir: deploy/image
    cmds:
      - go test ./...

  test:go:race:
    desc: Тесты Go с детектором гонок (нужен компилятор C; запускается в CI)
    dir: server
    cmds:
      - go test -race ./...

  test:ts:
    desc: Тесты TypeScript
    cmds:
      - pnpm -r run test

  db:up:
    desc: Запустить локальную базу YDB в Docker
    preconditions:
      - sh: docker info
        msg: Docker не запущен. Запусти Docker Desktop и повтори команду.
    cmds:
      - docker compose -f deploy/docker-compose.yml up -d

  db:down:
    desc: Остановить локальную базу (данные в памяти пропадут)
    cmds:
      - docker compose -f deploy/docker-compose.yml down

  migrate:
    desc: Применить миграции к базе из YDB_DSN (по умолчанию локальная); ждёт готовности базы до 60 с
    dir: server
    cmds:
      - go run ./cmd/admin migrate

  dev:
    desc: Локальный стенд — база, миграции, сервер и страница http://localhost:5173 (нужен Docker; остановка — Ctrl+C)
    cmds:
      - task: db:up
      - task: migrate
      - task: dev:run

  dev:run:
    desc: Сервер и Vite одновременно (база уже запущена и миграции применены)
    deps: [dev:server, dev:web]

  dev:server:
    desc: Только локальный сервер (база уже запущена и миграции применены)
    dir: server
    cmds:
      - go run ./cmd/server

  dev:web:
    desc: Только Vite — страница http://localhost:5173
    cmds:
      - pnpm --filter @coffeechat/web run dev

  build:web:
    desc: Собрать фронтенд в web/dist (нужны переменные VITE_API_URL и VITE_WS_URL)
    cmds:
      - pnpm --filter @coffeechat/web run build

  image:
    desc: Собрать образ контейнера сервера в server/bin/coffeechat-image.tar (Docker не нужен)
    vars:
      COMMIT:
        sh: git rev-parse --short HEAD
    cmds:
      - task: image:binary
        vars: { COMMIT: '{{.COMMIT}}' }
      - task: image:pack
        vars: { COMMIT: '{{.COMMIT}}' }

  image:binary:
    desc: Статический бинарник сервера для linux/amd64 в server/bin/container
    internal: true
    dir: server
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    cmds:
      - >-
        go build -trimpath
        -ldflags "-s -w -X git.sourcecraft.dev/drflamov/coffeechat/server/internal/version.commit={{.COMMIT}}"
        -o bin/container ./cmd/container

  image:pack:
    desc: Упаковать бинарник в образ
    internal: true
    dir: deploy/image
    cmds:
      - go run . -binary ../../server/bin/container -out ../../server/bin/coffeechat-image.tar -tag coffeechat:{{.COMMIT}}

  # --- Облако. Все команды требуют имя стенда: ENV=staging или ENV=prod. ---
  # Нужны terraform, yc и файл .secrets/<стенд>.env (см. deploy/README.md).

  deploy:
    desc: 'Выкатить стенд целиком: task deploy ENV=staging (APPROVE=-auto-approve — не спрашивать подтверждение)'
    requires:
      vars: [ENV]
    vars:
      COMMIT:
        sh: git rev-parse --short HEAD
    cmds:
      - task: tf
        vars: { ARGS: 'init -input=false' }
      # Первый проход — с тегом образа, который уже развёрнут (при первом деплое тега нет:
      # создаётся всё, кроме контейнера и шлюза). Так появляются реестр и база,
      # а работающий контейнер не меняется.
      - task: tf
        vars:
          ARGS: >-
            apply -input=false {{.APPROVE}}
            -var "image_tag=$(terraform output -raw image_tag 2>/dev/null || true)"
      - task: deploy:outputs
      - task: image
      - task: image:push
        vars: { COMMIT: '{{.COMMIT}}' }
      - task: migrate:cloud
      # Второй проход — контейнер с новым образом и шлюз.
      - task: tf
        vars: { ARGS: 'apply -input=false {{.APPROVE}} -var image_tag={{.COMMIT}}' }
      - task: deploy:outputs
      - task: deploy-web
      - task: smoke

  tf:
    desc: 'Terraform для стенда: task tf ENV=staging -- plan'
    requires:
      vars: [ENV]
    dir: deploy/terraform/envs/{{.ENV}}
    dotenv: ['{{.ROOT_DIR}}/.secrets/{{.ENV}}.env']
    env:
      YC_TOKEN:
        sh: yc iam create-token
    cmds:
      - terraform {{.ARGS | default .CLI_ARGS}}

  deploy:outputs:
    desc: Записать адреса стенда из Terraform в файлы для остальных команд
    requires:
      vars: [ENV]
    dir: deploy/terraform/envs/{{.ENV}}
    dotenv: ['{{.ROOT_DIR}}/.secrets/{{.ENV}}.env']
    env:
      YC_TOKEN:
        sh: yc iam create-token
    cmds:
      - terraform output -raw deploy_env > ../../../../.secrets/{{.ENV}}.outputs.env
      - terraform output -raw web_env > ../../../../web/.env.{{.ENV}}.local
      # Пустой файл значит, что Terraform ещё не применялся целиком.
      - cmd: test -s ../../../../.secrets/{{.ENV}}.outputs.env
        silent: true

  image:push:
    desc: Отправить образ сервера в реестр стенда (сначала task image)
    requires:
      vars: [ENV, COMMIT]
    dir: deploy/image
    dotenv: ['{{.ROOT_DIR}}/.secrets/{{.ENV}}.outputs.env']
    env:
      YC_TOKEN:
        sh: yc iam create-token
    cmds:
      - go run . -binary ../../server/bin/container -push "$IMAGE_REPOSITORY:{{.COMMIT}}"

  migrate:cloud:
    desc: 'Применить миграции к базе стенда: task migrate:cloud ENV=staging'
    requires:
      vars: [ENV]
    dir: server
    dotenv: ['{{.ROOT_DIR}}/.secrets/{{.ENV}}.outputs.env']
    env:
      YDB_ACCESS_TOKEN:
        sh: yc iam create-token
    cmds:
      - go run ./cmd/admin migrate

  deploy-web:
    desc: 'Собрать фронтенд с адресами стенда и выгрузить в бакет: task deploy-web ENV=staging'
    requires:
      vars: [ENV]
    dotenv: ['{{.ROOT_DIR}}/.secrets/{{.ENV}}.outputs.env']
    cmds:
      - pnpm --filter @coffeechat/web run build --mode {{.ENV}}
      - task: web:upload

  web:upload:
    desc: Выгрузить готовую сборку web/dist в бакет стенда
    internal: true
    requires:
      vars: [ENV]
    dir: server
    dotenv: ['{{.ROOT_DIR}}/.secrets/{{.ENV}}.outputs.env']
    cmds:
      - go run ./cmd/webupload -dir ../web/dist -bucket "$WEB_BUCKET"

  smoke:
    desc: 'Дымовой тест стенда: task smoke ENV=staging'
    requires:
      vars: [ENV]
    dir: server
    dotenv: ['{{.ROOT_DIR}}/.secrets/{{.ENV}}.outputs.env']
    cmds:
      - go run ./cmd/smoke -api "$API_URL" -ws "$WS_URL" -web "$WEB_URL"

  test:store:
    desc: Контрактные тесты адаптера YDB на локальной базе (нужен Docker)
    dir: server
    env:
      YDB_DSN: grpc://localhost:2136/local
    cmds:
      - task: db:up
      - task: migrate
      - go test -count=1 ./internal/store/...

  fmt:
    desc: Отформатировать код
    cmds:
      - cmd: golangci-lint fmt ./...
        dir: server
      - cmd: golangci-lint fmt --config ../../server/.golangci.yml ./...
        dir: deploy/image
      - pnpm exec prettier --write .
      - pnpm exec buf format --write
