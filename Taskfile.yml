# Команды проекта. Запуск: task <имя>. Список: task --list
# Task выбран вместо make: одинаково работает на Windows и в Linux без дополнительной оболочки.
version: '3'

tasks:
  default:
    desc: Показать список команд
    cmds:
      - task --list
    silent: true

  lint:
    desc: Линтеры Go и TypeScript, проверка форматирования
    deps: [lint:go, lint:ts, lint:proto]

  lint:go:
    desc: golangci-lint для server/
    dir: server
    cmds:
      - golangci-lint run ./...

  lint:ts:
    desc: ESLint, Prettier и проверка типов
    cmds:
      - pnpm exec eslint .
      - pnpm exec prettier --check .
      - pnpm -r run typecheck

  lint:proto:
    desc: buf lint и проверка форматирования схем в proto/
    cmds:
      - pnpm exec buf lint
      - pnpm exec buf format --diff --exit-code

  proto:
    desc: Сгенерировать код Go и TypeScript из proto/
    cmds:
      - pnpm exec buf lint
      - pnpm exec buf generate

  test:
    desc: Все тесты (Go и TypeScript)
    deps: [test:go, test:ts]

  test:go:
    desc: Тесты Go
    dir: server
    cmds:
      - go test ./...

  test:go:race:
    desc: Тесты Go с детектором гонок (нужен компилятор C; запускается в CI)
    dir: server
    cmds:
      - go test -race ./...

  test:ts:
    desc: Тесты TypeScript
    cmds:
      - pnpm -r run test

  db:up:
    desc: Запустить локальную базу YDB в Docker
    preconditions:
      - sh: docker info
        msg: Docker не запущен. Запусти Docker Desktop и повтори команду.
    cmds:
      - docker compose -f deploy/docker-compose.yml up -d

  db:down:
    desc: Остановить локальную базу (данные в памяти пропадут)
    cmds:
      - docker compose -f deploy/docker-compose.yml down

  migrate:
    desc: Применить миграции к базе из YDB_DSN (по умолчанию локальная); ждёт готовности базы до 60 с
    dir: server
    cmds:
      - go run ./cmd/admin migrate

  dev:
    desc: Локальный стенд — база, миграции, сервер и страница http://localhost:5173 (нужен Docker; остановка — Ctrl+C)
    cmds:
      - task: db:up
      - task: migrate
      - task: dev:run

  dev:run:
    desc: Сервер и Vite одновременно (база уже запущена и миграции применены)
    deps: [dev:server, dev:web]

  dev:server:
    desc: Только локальный сервер (база уже запущена и миграции применены)
    dir: server
    cmds:
      - go run ./cmd/server

  dev:web:
    desc: Только Vite — страница http://localhost:5173
    cmds:
      - pnpm --filter @coffeechat/web run dev

  build:web:
    desc: Собрать фронтенд в web/dist (нужны переменные VITE_API_URL и VITE_WS_URL)
    cmds:
      - pnpm --filter @coffeechat/web run build

  test:store:
    desc: Контрактные тесты адаптера YDB на локальной базе (нужен Docker)
    dir: server
    env:
      YDB_DSN: grpc://localhost:2136/local
    cmds:
      - task: db:up
      - task: migrate
      - go test -count=1 ./internal/store/...

  fmt:
    desc: Отформатировать код
    cmds:
      - cmd: golangci-lint fmt ./...
        dir: server
      - pnpm exec prettier --write .
      - pnpm exec buf format --write
